name: patch-apply

# Trigger hygiene: `push` is constrained to branches because a `pull_request`
# trigger exists. A bare `push:` would fire a second, duplicate run for every
# PR-branch push, and `concurrency` does NOT dedupe that — the push event's ref
# (refs/heads/<branch>) and the PR event's ref (refs/pull/N/merge) hash to
# different concurrency groups.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly drift watch: has Armbian moved rk3588 edge off the pinned kernel line?
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Change detection. A documentation-only pull request has nothing for the
  # gates below to prove, so they skip rather than run to a vacuous green.
  #
  # The gating is a JOB-LEVEL `if:`, never a trigger-level `paths:`/
  # `paths-ignore:`. A trigger filter stops the workflow from starting at all,
  # and a required check that never reports blocks a merge instead of passing
  # it — which is what the always-run summary job at the bottom exists to avoid.
  #
  # TWO filter steps, and the split is load-bearing. `code` is an EXCLUSION list
  # ("every changed file is NOT documentation") and therefore carries
  # `predicate-quantifier: 'every'`. `kernel` is a POSITIVE OR list naming the
  # inputs the ~2 GB kernel clone actually depends on, so it must keep the
  # default `some`. The quantifier is a property of the STEP, not of a filter:
  # putting both in one step under `every` would turn the positive list into an
  # AND that no single file can satisfy, and the expensive lane would never run.
  changes:
    name: Change detection
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      # Both filters run on pull requests only. On a push, the weekly schedule
      # or a manual dispatch the steps are skipped and the fallbacks keep both
      # outputs true, so those events keep their full coverage.
      code: ${{ steps.filter.outputs.code || 'true' }}
      kernel: ${{ steps.kernel-filter.outputs.kernel || 'true' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect non-documentation changes
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v4
        with:
          predicate-quantifier: 'every'
          filters: |
            code:
              - '!**/*.md'
              - '!docs/**'
              - '!LICENSE*'
              - '!.github/ISSUE_TEMPLATE/**'
              - '!.github/PULL_REQUEST_TEMPLATE.md'

      - name: Detect changes the kernel clone depends on
        id: kernel-filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v4
        with:
          filters: |
            kernel:
              - 'patches/**'
              - 'scripts/**'
              - 'kernel-pin.env'
              - '.github/**'

  # Cheap and fast: does patches/ still match what the converter produces from
  # upstream/ + ceralive/, and does it still change nothing those sources did not
  # already change? Runs first so a hand-edited series fails in seconds rather
  # than after a 2 GB kernel clone.
  series-integrity:
    name: series integrity
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@v7

      - name: patches/ is generated, not hand-edited
        run: python3 scripts/build-series.py --check

      - name: patches/ payload is byte-identical to its source lane
        run: python3 scripts/verify-payload-parity.py

      - name: island/ is byte-identical to the published release asset
        run: python3 scripts/verify-island-provenance.py

      - name: series, generated patches and the status ledger tell one story
        run: |
          scripts/check-series-ledger.py --self-test
          scripts/check-series-ledger.py --require-before U2:U1
          scripts/check-series-ledger.py --exact docs/UPSTREAM-STATUS.md

      - name: the candidate reconciliation matrix is complete
        run: |
          python3 scripts/validate-candidate-matrix.py docs/UPSTREAM-STATUS.md \
            --aliases M1,M2,M3,M4,M5,M6,M7,M8,U1,U2,U3,U4,U5,U6,U7,N1,N2,N3,N4,N5,N6,N7,N8,N9,N10,N11,N12,N13 \
            --source-sha256 dd1b0d9c740bd26b8a3ea593f0e1226eab5d21f8e612f09c387e65a58aa74753

      - name: provenance and lore-import fixtures
        run: >-
          python3 -m unittest
          tests.test_lore_import
          tests.test_build_series_provenance
          tests.test_island_lane
          tests.test_verify_island_provenance

      - name: upstream/ is unmodified since import
        run: |
          source kernel-pin.env
          echo "Imported from $UPSTREAM_PATCHES_REPO at $UPSTREAM_PATCHES_REV"
          # The fork's own history is the provenance record; assert the import
          # commit is still an ancestor so a rewrite cannot go unnoticed.
          git fetch --deepen=50 --quiet || true
          if git cat-file -e "$UPSTREAM_PATCHES_REV^{commit}" 2>/dev/null; then
            git merge-base --is-ancestor "$UPSTREAM_PATCHES_REV" HEAD \
              && echo "ok: import commit is an ancestor of HEAD"
          else
            echo "note: import commit not in this shallow checkout; skipping ancestry check"
          fi

  # kernel-pin.env is the single source of truth for the pinned coordinates, so the
  # apply matrix is READ from it rather than restated here. A hard-coded tag would
  # go stale the moment the pin is bumped, and a stale matrix fails green: the job
  # would prove the series against a kernel nobody ships.
  pin:
    name: resolve kernel pin
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    outputs:
      tags: ${{ steps.read.outputs.tags }}
    steps:
      - uses: actions/checkout@v7

      - name: Read the apply matrix from kernel-pin.env
        id: read
        run: |
          set -euo pipefail
          # shellcheck source=/dev/null
          source kernel-pin.env
          : "${KERNEL_TAG:?KERNEL_TAG is not set in kernel-pin.env}"
          echo "tags=[\"$KERNEL_TAG\"]" >> "$GITHUB_OUTPUT"
          echo "apply matrix: [\"$KERNEL_TAG\"]"

  # Armbian mapping is informational on every trigger; only the sovereign pin
  # checks and the separate apply job can block push/PR.
  preflight:
    name: armbian pin preflight
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    continue-on-error: ${{ github.event_name == 'schedule' }}
    steps:
      - uses: actions/checkout@v7

      - name: test sovereign preflight scenarios
        run: tests/test_preflight_sovereign_pin.sh

      - name: validate the sovereign kernel pin and report Armbian mapping
        run: scripts/preflight.sh

      - name: report current Armbian mapping for the selected alias
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: scripts/preflight.sh --head

  # The gate. Runs the exact script the README tells a human to run, so a broken
  # instruction is a red build.
  apply:
    name: git am against ${{ matrix.tag }}
    needs: [changes, series-integrity, pin]
    # The ~2 GB kernel clone runs only when an input it actually depends on
    # moved. This is the POSITIVE `some` filter, not the `every` exclusion one.
    if: needs.changes.outputs.kernel == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Derived from KERNEL_TAG, so it is a single entry today and cannot drift
        # from the pin. It stays a matrix so a future bump can widen it to prove
        # the series against the old and new tag in the same run.
        tag: ${{ fromJSON(needs.pin.outputs.tags) }}
    steps:
      - uses: actions/checkout@v7

      - name: Resolve the pin
        id: pin
        run: |
          source kernel-pin.env
          # KERNEL_COMMIT below is the commit of KERNEL_TAG and of nothing else, so
          # a matrix entry that is not KERNEL_TAG would cache and verify against the
          # wrong tree. Widening the matrix means resolving the commit per entry.
          [ "$KERNEL_TAG" = "${{ matrix.tag }}" ] || {
            echo "::error::matrix tag ${{ matrix.tag }} != KERNEL_TAG $KERNEL_TAG"
            exit 1
          }
          {
            echo "tag=$KERNEL_TAG"
            echo "commit=$KERNEL_COMMIT"
            echo "mirror=$KERNEL_MIRROR"
          } >> "$GITHUB_OUTPUT"

      # The kernel clone dominates the job. Key on the immutable commit, so the
      # cache is only ever reused for the exact source it was built from.
      - name: Cache kernel tree
        id: kernel-cache
        uses: actions/cache@v6
        with:
          path: .work/linux
          key: linux-${{ runner.os }}-${{ steps.pin.outputs.commit }}

      - name: Clone kernel at ${{ steps.pin.outputs.tag }}
        if: steps.kernel-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --single-branch \
            --branch "${{ steps.pin.outputs.tag }}" \
            "${{ steps.pin.outputs.mirror }}" .work/linux

      - name: Reset the cached tree
        run: |
          git -C .work/linux am --abort 2>/dev/null || true
          git -C .work/linux checkout -f "${{ steps.pin.outputs.tag }}"
          git -C .work/linux clean -fdxq

      - name: Apply the series
        env:
          KEEP_TREE: "1"
        run: scripts/apply.sh .work/linux

      # Save the pristine tree, never a patched one: apply.sh leaves the git am
      # commits in place, and caching those would poison the next run's reset.
      - name: Restore the tree to the pinned tag before caching
        if: always()
        run: |
          git -C .work/linux am --abort 2>/dev/null || true
          git -C .work/linux checkout -f "${{ steps.pin.outputs.tag }}"
          git -C .work/linux reset --hard "${{ steps.pin.outputs.tag }}"
          git -C .work/linux clean -fdxq

  # The one check a branch-protection rule can require. It runs on every event,
  # including a docs-only pull request where every gate above skipped, and goes
  # red whenever a dependency failed or was cancelled. A SKIPPED dependency is a
  # pass — that is the whole point of the gating above.
  patch-apply-summary:
    name: patch-apply summary
    if: always()
    needs:
      - changes
      - series-integrity
      - pin
      - preflight
      - apply
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any dependency failed or was cancelled
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          set -euo pipefail
          echo "dependency results: ${RESULTS}"
          for result in ${RESULTS}; do
            case "${result}" in
              failure|cancelled)
                echo "::error::a required job reported '${result}'"
                exit 1
                ;;
            esac
          done
          echo "every dependency succeeded or was skipped"
